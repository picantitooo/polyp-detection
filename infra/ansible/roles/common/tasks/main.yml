---
- name: Consultar distribución del sistema
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", distribution]

- name: Comprobar Amazon Linux 2023
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Amazon'
      - ansible_facts.distribution_major_version == '2023'
    fail_msg: Este despliegue requiere Amazon Linux 2023.

- name: Instalar Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Habilitar e iniciar Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Comprobar si AWS CLI ya está instalado
  ansible.builtin.shell: command -v aws
  register: common_aws_command
  changed_when: false
  failed_when: common_aws_command.rc not in [0, 1]

- name: Instalar AWS CLI de Amazon Linux 2023 si falta
  ansible.builtin.dnf:
    name: awscli2
    state: present
  when: common_aws_command.rc != 0

- name: Comprobar disponibilidad de curl
  ansible.builtin.command: curl --version
  changed_when: false

- name: Crear directorio de aplicación administrado por root
  ansible.builtin.file:
    path: /opt/polyp
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Verificar Docker y AWS CLI
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - [docker, info]
    - [aws, --version]
  changed_when: false
