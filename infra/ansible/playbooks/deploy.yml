---
- name: Validar el despliegue antes de contactar las instancias
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [always, preflight, deploy]
  tasks:
    - name: Validar variables de entorno obligatorias sin exponer sus valores
      ansible.builtin.assert:
        that:
          - polyp_aws_region == 'us-east-2'
          - polyp_turn_parameter_name == '/polyp/staging/turn/shared-secret'
          - polyp_proxy_public_ip is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
          - polyp_proxy_private_ip is match('^10(\.[0-9]{1,3}){3}$')
          - polyp_turn_url in ['turn:' ~ polyp_proxy_public_ip ~ ':3478?transport=udp', 'turn:' ~ polyp_proxy_public_ip ~ ':3478?transport=tcp']
          - ansible_aws_ssm_bucket_name | length > 0
          - polyp_backend_image is match(ecr_image_pattern)
          - polyp_frontend_image is match(ecr_image_pattern)
          - polyp_model_bucket is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
          - polyp_public_origin is match('^http://[a-zA-Z0-9][a-zA-Z0-9.-]*(?::[0-9]{1,5})?$')
        fail_msg: >-
          Exporta POLYP_BACKEND_IMAGE y POLYP_FRONTEND_IMAGE como URI ECR con tag,
          POLYP_MODEL_BUCKET, POLYP_PUBLIC_ORIGIN como origen HTTP sin ruta,
          ANSIBLE_SSM_BUCKET, AWS_REGION=us-east-2, POLYP_TURN_PARAMETER_NAME,
          POLYP_TURN_URL, POLYP_PROXY_PUBLIC_IP y POLYP_PROXY_PRIVATE_IP.
      vars:
        ecr_image_pattern: '^[0-9]{12}\.dkr\.ecr\.us-east-2\.amazonaws\.com/[a-z0-9]+(?:[._/-]+[a-z0-9]+)*:[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$'
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: Validar las tres instancias y el transporte SSM
      ansible.builtin.assert:
        that:
          - groups.get('role_backend', []) | length == 1
          - groups.get('role_frontend', []) | length == 1
          - groups.get('role_proxy', []) | length == 1
          - groups['all'] | length == 3
          - >-
            (groups.get('role_backend', []) + groups.get('role_frontend', []) +
            groups.get('role_proxy', [])) | unique | length == 3
        fail_msg: Se requiere una EC2 distinta por rol y conexión SSM en us-east-2.
      delegate_to: localhost
      become: false

    - name: Validar conexión SSM y región de cada instancia
      ansible.builtin.assert:
        that:
          - hostvars[item].ansible_connection == 'amazon.aws.aws_ssm'
          - hostvars[item].ansible_aws_ssm_region == polyp_aws_region
        fail_msg: Todas las instancias deben usar SSM en us-east-2.
      loop: "{{ groups['all'] }}"
      delegate_to: localhost
      become: false

    - name: Validar direcciones privadas de los upstreams del proxy
      ansible.builtin.assert:
        that:
          - hostvars[item].private_ip_address | default('') is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
        fail_msg: El inventario debe proporcionar private_ip_address para cada upstream.
      loop: "{{ groups['role_backend'] + groups['role_frontend'] + groups['role_proxy'] }}"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: Verificar que la IP privada TURN corresponde al proxy del inventario
      ansible.builtin.assert:
        that:
          - polyp_proxy_private_ip == hostvars[groups['role_proxy'][0]].private_ip_address
        fail_msg: POLYP_PROXY_PRIVATE_IP debe coincidir con la EC2 proxy del inventario.
      delegate_to: localhost
      become: false
      no_log: true

- name: Preparar Amazon Linux 2023 en las tres EC2
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [common, deploy]
  pre_tasks:
    - name: Esperar disponibilidad de la conexión SSM
      ansible.builtin.wait_for_connection:
        timeout: 300
        sleep: 10
  roles:
    - common

- name: Desplegar y comprobar backend
  hosts: role_backend
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [backend, deploy]
  roles:
    - backend

- name: Desplegar y comprobar frontend
  hosts: role_frontend
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [frontend, deploy]
  roles:
    - frontend

- name: Desplegar y comprobar proxy HTTP
  hosts: role_proxy
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: [proxy, deploy]
  roles:
    - proxy
