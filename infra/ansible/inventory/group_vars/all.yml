---
ansible_connection: amazon.aws.aws_ssm
ansible_python_interpreter: /usr/bin/python3
ansible_aws_ssm_region: us-east-2
ansible_aws_ssm_s3_addressing_style: virtual
ansible_aws_ssm_bucket_name: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSM_BUCKET', default=undef()) | mandatory }}"

# Los valores de despliegue nunca se guardan en el repositorio.
polyp_backend_image: "{{ lookup('ansible.builtin.env', 'POLYP_BACKEND_IMAGE') }}"
polyp_frontend_image: "{{ lookup('ansible.builtin.env', 'POLYP_FRONTEND_IMAGE') }}"
polyp_model_bucket: "{{ lookup('ansible.builtin.env', 'POLYP_MODEL_BUCKET') }}"
polyp_public_origin: "{{ lookup('ansible.builtin.env', 'POLYP_PUBLIC_ORIGIN') }}"
polyp_aws_region: "{{ lookup('ansible.builtin.env', 'AWS_REGION') }}"
polyp_turn_parameter_name: "{{ lookup('ansible.builtin.env', 'POLYP_TURN_PARAMETER_NAME') }}"
polyp_turn_url: "{{ lookup('ansible.builtin.env', 'POLYP_TURN_URL') }}"
polyp_proxy_public_ip: "{{ lookup('ansible.builtin.env', 'POLYP_PROXY_PUBLIC_IP') }}"
polyp_proxy_private_ip: "{{ lookup('ansible.builtin.env', 'POLYP_PROXY_PRIVATE_IP') }}"
